<svg xmlns="http://www.w3.org/2000/svg" width="860" height="354" viewBox="0 0 860 354" role="img" aria-label="Lenguajes según mis repos de GitHub, por bytes: Python, Batchfile, Dart, HTML, C++, CMake, Shell, Swift">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#e0338f"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140b22"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="860" height="354" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="860" height="354" fill="url(#cardGrad)"/>
    <rect x="0.5" y="0.5" width="859" height="353" fill="none" stroke="#2a1c46" stroke-width="1.5"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">
      <text x="28" y="42" font-size="13" font-weight="600" fill="#8a6fb0" letter-spacing="3">STACK</text>
      <line x1="28" y1="58" x2="832" y2="58" stroke="#2a1c46" stroke-width="1"/>

      <g>
        <text x="28" y="100" font-size="14" fill="#cbb6f0">Python</text>
        <rect x="200" y="89" width="632" height="14" rx="3" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <rect x="200" y="89" width="0" height="14" rx="3" fill="url(#barGrad)">
          <animate attributeName="width" values="0;181" dur="1.05s" begin="0.10s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
      </g>
      <g>
        <text x="28" y="133" font-size="14" fill="#cbb6f0">Batchfile</text>
