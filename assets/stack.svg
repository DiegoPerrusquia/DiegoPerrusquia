        <rect x="200" y="287" width="0" height="14" rx="3" fill="url(#barGrad)">
          <animate attributeName="width" values="0;5" dur="1.05s" begin="0.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
      </g>
      <g>
