<svg xmlns="http://www.w3.org/2000/svg" width="860" height="392" viewBox="0 0 860 392" role="img" aria-label="Stack de lenguajes de Diego Perrusquia">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a5a12"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181008"/>
      <stop offset="100%" stop-color="#0c0805"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="860" height="392" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="860" height="392" fill="url(#cardGrad)"/>
    <rect x="0" y="0" width="860" height="392" fill="none" stroke="#4a3410" stroke-width="2"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">

      <text x="28" y="44" font-size="21" font-weight="600" fill="#ffd97a" letter-spacing="1.5">stack --list --sort=uso</text>
      <rect x="286" y="30" width="10" height="18" fill="#ffb000">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/>
      </rect>
      <text x="28" y="66" font-size="12.5" fill="#8a5a12" letter-spacing="0.6">ordenado por lo que toco entre semana, no por lo que se ve bonito en un CV</text>

      <line x1="28" y1="82" x2="832" y2="82" stroke="#4a3410" stroke-width="1" stroke-dasharray="3 4"/>

      <g>
        <text x="28" y="116" font-size="13.5" fill="#ffb000">Python</text>
        <rect x="150" y="105" width="300" height="13" rx="2" fill="#1c1309" stroke="#4a3410" stroke-width="1"/>
        <rect x="150" y="105" width="0" height="13" rx="2" fill="url(#barGrad)">
          <animate attributeName="width" values="0;282" dur="1.05s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="470" y="116" font-size="12" fill="#8a5a12">scripting · data · motores de IA</text>
      </g>

      <g>
        <text x="28" y="152" font-size="13.5" fill="#ffb000">Bash</text>
        <rect x="150" y="141" width="300" height="13" rx="2" fill="#1c1309" stroke="#4a3410" stroke-width="1"/>
        <rect x="150" y="141" width="0" height="13" rx="2" fill="url(#barGrad)">
          <animate attributeName="width" values="0;264" dur="1.05s" begin="0.27s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="470" y="152" font-size="12" fill="#8a5a12">mi terreno: casi todo lo rooteado corre Linux</text>
      </g>

      <g>
        <text x="28" y="188" font-size="13.5" fill="#ffb000">PowerShell</text>
        <rect x="150" y="177" width="300" height="13" rx="2" fill="#1c1309" stroke="#4a3410" stroke-width="1"/>
        <rect x="150" y="177" width="0" height="13" rx="2" fill="url(#barGrad)">
          <animate attributeName="width" values="0;258" dur="1.05s" begin="0.39s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="470" y="188" font-size="12" fill="#8a5a12">el idioma nativo de Active Directory</text>
      </g>

      <g>
        <text x="28" y="224" font-size="13.5" fill="#ffb000">JavaScript</text>
        <rect x="150" y="213" width="300" height="13" rx="2" fill="#1c1309" stroke="#4a3410" stroke-width="1"/>
        <rect x="150" y="213" width="0" height="13" rx="2" fill="url(#barGrad)">
          <animate attributeName="width" values="0;234" dur="1.05s" begin="0.51s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="470" y="224" font-size="12" fill="#8a5a12">interfaces que sí se sienten bien de usar</text>
      </g>

      <g>
        <text x="28" y="260" font-size="13.5" fill="#ffb000">SQL</text>
        <rect x="150" y="249" width="300" height="13" rx="2" fill="#1c1309" stroke="#4a3410" stroke-width="1"/>
        <rect x="150" y="249" width="0" height="13" rx="2" fill="url(#barGrad)">
          <animate attributeName="width" values="0;216" dur="1.05s" begin="0.63s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="470" y="260" font-size="12" fill="#8a5a12">para consultarla y para romperla</text>
      </g>

      <g>
        <text x="28" y="296" font-size="13.5" fill="#ffb000">C#</text>
        <rect x="150" y="285" width="300" height="13" rx="2" fill="#1c1309" stroke="#4a3410" stroke-width="1"/>
        <rect x="150" y="285" width="0" height="13" rx="2" fill="url(#barGrad)">
          <animate attributeName="width" values="0;192" dur="1.05s" begin="0.75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="470" y="296" font-size="12" fill="#8a5a12">herramienta propia cuando Windows es el objetivo</text>
      </g>

      <g>
        <text x="28" y="332" font-size="13.5" fill="#ffb000">C++</text>
        <rect x="150" y="321" width="300" height="13" rx="2" fill="#1c1309" stroke="#4a3410" stroke-width="1"/>
        <rect x="150" y="321" width="0" height="13" rx="2" fill="url(#barGrad)">
          <animate attributeName="width" values="0;174" dur="1.05s" begin="0.87s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="470" y="332" font-size="12" fill="#8a5a12">cuando hay que bajar a ver cómo funciona por dentro</text>
      </g>

      <line x1="28" y1="352" x2="832" y2="352" stroke="#4a3410" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="28" y="374" font-size="11.5" fill="#8a5a12" letter-spacing="0.5">las barras son qué tanto lo uso, no un certificado</text>

    </g>
  </g>
</svg>
