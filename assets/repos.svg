<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312" role="img" aria-label="Repositorios destacados: nyx-framework, Async-Web-C2, POWERSHELL2.0-PATCHER, SMARTEC-APP">
  <defs>
    <linearGradient id="repoCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140b22"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <clipPath id="repoClip"><rect x="0" y="0" width="860" height="312" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#repoClip)">
    <rect x="0" y="0" width="860" height="312" fill="url(#repoCard)"/>
    <rect x="0.5" y="0.5" width="859" height="311" fill="none" stroke="#2a1c46" stroke-width="1.5"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">
      <text x="28" y="42" font-size="14" font-weight="600" fill="#c891ff" letter-spacing="2">&gt;_ REPOSITORIOS</text>
      <line x1="28" y1="56" x2="832" y2="56" stroke="#2a1c46" stroke-width="1"/>

      <!-- nyx-framework -->
      <g>
        <rect x="28" y="74" width="40" height="40" rx="8" fill="#170f27" stroke="#a855f7" stroke-width="1"/>
        <text x="48" y="99" font-size="16" text-anchor="middle" fill="#a855f7">&#9737;</text>
        <text x="84" y="90" font-size="15.5" font-weight="600" fill="#e9d5ff">nyx-framework</text>
        <text x="84" y="108" font-size="12.5" fill="#8a6fb0">Framework de reconocimiento de red — CLI + interfaz web</text>
        <circle cx="742" cy="86" r="4.5" fill="#3572A5"/>
        <text x="754" y="90" font-size="12" fill="#8a6fb0">Python</text>
      </g>

      <!-- Async-Web-C2 -->
      <g>
        <rect x="28" y="130" width="40" height="40" rx="8" fill="#170f27" stroke="#f43f5e" stroke-width="1"/>
        <text x="48" y="155" font-size="16" text-anchor="middle" fill="#f43f5e">&#9737;</text>
        <text x="84" y="146" font-size="15.5" font-weight="600" fill="#e9d5ff">Async-Web-C2</text>
        <text x="84" y="164" font-size="12.5" fill="#8a6fb0">Command &amp; Control web asincrono</text>
        <circle cx="742" cy="142" r="4.5" fill="#3572A5"/>
        <text x="754" y="146" font-size="12" fill="#8a6fb0">Python</text>
      </g>

