<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" role="img" aria-label="Repositorios destacados: nyx-framework, Async-Web-C2, POWERSHELL2.0-PATCHER, SMARTEC-APP">
  <defs>
    <linearGradient id="repoCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140b22"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <clipPath id="repoClip"><rect x="0" y="0" width="500" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#repoClip)">
    <rect x="0" y="0" width="500" height="340" fill="url(#repoCard)"/>
    <rect x="0.5" y="0.5" width="499" height="339" fill="none" stroke="#2a1c46" stroke-width="1.5"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">
      <text x="24" y="40" font-size="13" font-weight="600" fill="#c891ff" letter-spacing="2">&gt;_ REPOSITORIOS</text>
      <line x1="24" y1="54" x2="476" y2="54" stroke="#2a1c46" stroke-width="1"/>

      <!-- nyx-framework -->
      <g>
        <rect x="24" y="70" width="34" height="34" rx="7" fill="#170f27" stroke="#a855f7" stroke-width="1"/>
        <text x="41" y="92" font-size="14" text-anchor="middle" fill="#a855f7">&#9737;</text>
        <text x="72" y="84" font-size="14.5" font-weight="600" fill="#e9d5ff">nyx-framework</text>
        <text x="72" y="101" font-size="11.5" fill="#8a6fb0">Framework de reconocimiento de red — CLI + web</text>
        <circle cx="410" cy="80" r="4" fill="#3572A5"/>
        <text x="420" y="84" font-size="11" fill="#8a6fb0">Python</text>
      </g>

      <!-- Async-Web-C2 -->
      <g>
        <rect x="24" y="132" width="34" height="34" rx="7" fill="#170f27" stroke="#f43f5e" stroke-width="1"/>
        <text x="41" y="154" font-size="14" text-anchor="middle" fill="#f43f5e">&#9737;</text>
        <text x="72" y="146" font-size="14.5" font-weight="600" fill="#e9d5ff">Async-Web-C2</text>
        <text x="72" y="163" font-size="11.5" fill="#8a6fb0">Command &amp; Control web asincrono</text>
        <circle cx="410" cy="142" r="4" fill="#3572A5"/>
        <text x="420" y="146" font-size="11" fill="#8a6fb0">Python</text>
      </g>

      <!-- POWERSHELL2.0-PATCHER -->
      <g>
        <rect x="24" y="194" width="34" height="34" rx="7" fill="#170f27" stroke="#a855f7" stroke-width="1"/>
        <text x="41" y="216" font-size="14" text-anchor="middle" fill="#a855f7">&#9737;</text>
        <text x="72" y="208" font-size="14.5" font-weight="600" fill="#e9d5ff">POWERSHELL2.0-PATCHER</text>
        <text x="72" y="225" font-size="11.5" fill="#8a6fb0">Restaura/instala el motor de PowerShell 2.0</text>
        <circle cx="400" cy="204" r="4" fill="#C1F12E"/>
        <text x="410" y="208" font-size="11" fill="#8a6fb0">Batchfile</text>
      </g>

      <!-- SMARTEC-APP -->
      <g>
        <rect x="24" y="256" width="34" height="34" rx="7" fill="#170f27" stroke="#f43f5e" stroke-width="1"/>
        <text x="41" y="278" font-size="14" text-anchor="middle" fill="#f43f5e">&#9737;</text>
        <text x="72" y="270" font-size="14.5" font-weight="600" fill="#e9d5ff">SMARTEC-APP</text>
        <text x="72" y="287" font-size="11.5" fill="#8a6fb0">App de gestion de rutas de movilidad</text>
        <circle cx="424" cy="266" r="4" fill="#00B4AB"/>
        <text x="434" y="270" font-size="11" fill="#8a6fb0">Dart</text>
      </g>

      <text x="24" y="320" font-size="11.5" fill="#a855f7">github.com/DiegoPerrusquia?tab=repositories  &#8594;</text>
