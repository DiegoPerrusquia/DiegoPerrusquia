      <g>
        <rect x="28" y="242" width="40" height="40" rx="8" fill="#170f27" stroke="#f43f5e" stroke-width="1"/>
        <text x="48" y="267" font-size="16" text-anchor="middle" fill="#f43f5e">&#9737;</text>
        <text x="84" y="258" font-size="15.5" font-weight="600" fill="#e9d5ff">SMARTEC-APP</text>
