        <animate attributeName="opacity" values="0;0;1;1;1" dur="4s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.95;1"/>
      </text>

      <text x="30" y="126" font-size="19" font-weight="600" fill="#c891ff" letter-spacing="1.2">UMBRA</text>
