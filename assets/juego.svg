<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-label="umbra: reto de terminal estilo HackTheBox, entra y consigue root">
  <defs>
    <linearGradient id="jGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#160c26"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <clipPath id="jClip"><rect x="0" y="0" width="860" height="150" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#jClip)">
    <rect x="0" y="0" width="860" height="150" fill="url(#jGrad)"/>
    <rect x="0.75" y="0.75" width="858.5" height="148.5" fill="none" stroke="#a855f7" stroke-width="1.5"/>

    <rect x="0" y="0" width="860" height="34" fill="#17102a"/>
    <line x1="0" y1="34" x2="860" y2="34" stroke="#2a1c46" stroke-width="1"/>
    <circle cx="24" cy="17" r="5" fill="#f43f5e"/>
    <circle cx="42" cy="17" r="5" fill="#f5b342"/>
    <circle cx="60" cy="17" r="5" fill="#a855f7"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">
      <text x="82" y="21" font-size="12.5" fill="#7a688f">root@ctf: ~/umbra</text>
      <text x="828" y="21" font-size="11" fill="#e0338f" text-anchor="end">objetivo: 10.10.11.42</text>

      <text x="30" y="70" font-size="13.5" fill="#a855f7">hacker@kali</text>
      <text x="145" y="70" font-size="13.5" fill="#e0338f">:~$</text>
      <text x="176" y="70" font-size="13.5" fill="#cbb6f0">
        <tspan>nmap 10.10.11.42</tspan>
      </text>
      <rect x="368" y="59" width="9" height="15" fill="#e0338f">
        <animate attributeName="opacity" values="0;0;1;1;0;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.02;0.05;0.35;0.38;1"/>
