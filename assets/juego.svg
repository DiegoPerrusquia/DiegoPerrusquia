<svg xmlns="http://www.w3.org/2000/svg" width="860" height="132" viewBox="0 0 860 132" role="img" aria-label="Compromete la Red: juego interactivo de pentest en el navegador">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1309"/>
      <stop offset="100%" stop-color="#0c0805"/>
    </linearGradient>
    <clipPath id="ctaClip">
      <rect x="0" y="0" width="860" height="132" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ctaClip)">
    <rect x="0" y="0" width="860" height="132" fill="url(#ctaGrad)"/>
    <rect x="0" y="0" width="860" height="132" fill="none" stroke="#ffb000" stroke-width="2"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">

      <text x="30" y="48" font-size="25" font-weight="600" fill="#ffd97a" letter-spacing="1.8">COMPROMETE LA RED</text>
      <text x="30" y="74" font-size="13" fill="#ffb000">5 nodos. 5 retos. de recon hasta la base de datos.</text>
      <text x="30" y="98" font-size="12.5" fill="#8a5a12">
        <tspan>&gt; da clic y entra</tspan>
      </text>
      <rect x="156" y="87" width="9" height="15" fill="#ffb000">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/>
      </rect>

      <g transform="translate(505, 66)">
        <line x1="14" y1="0" x2="86" y2="0" stroke="#4a3410" stroke-width="2"/>
        <line x1="14" y1="0" x2="86" y2="0" stroke="#ffb000" stroke-width="2" stroke-dasharray="72" stroke-dashoffset="72">
          <animate attributeName="stroke-dashoffset" values="72;72;0;0;72" dur="5s" repeatCount="indefinite" keyTimes="0;0.12;0.28;0.9;1"/>
        </line>
        <line x1="100" y1="0" x2="172" y2="0" stroke="#4a3410" stroke-width="2"/>
        <line x1="100" y1="0" x2="172" y2="0" stroke="#ffb000" stroke-width="2" stroke-dasharray="72" stroke-dashoffset="72">
          <animate attributeName="stroke-dashoffset" values="72;72;0;0;72" dur="5s" repeatCount="indefinite" keyTimes="0;0.34;0.5;0.9;1"/>
        </line>
        <line x1="186" y1="0" x2="258" y2="0" stroke="#4a3410" stroke-width="2"/>
        <line x1="186" y1="0" x2="258" y2="0" stroke="#ffb000" stroke-width="2" stroke-dasharray="72" stroke-dashoffset="72">
          <animate attributeName="stroke-dashoffset" values="72;72;0;0;72" dur="5s" repeatCount="indefinite" keyTimes="0;0.56;0.72;0.9;1"/>
        </line>

        <g>
          <circle cx="0" cy="0" r="13" fill="#0c0805" stroke="#ffb000" stroke-width="2"/>
          <circle cx="0" cy="0" r="4.5" fill="#ffb000"/>
          <text x="0" y="30" font-size="9.5" fill="#8a5a12" text-anchor="middle" letter-spacing="0.6">RECON</text>
        </g>

        <g>
          <circle cx="93" cy="0" r="13" fill="#0c0805" stroke="#4a3410" stroke-width="2">
            <animate attributeName="stroke" values="#4a3410;#4a3410;#ffb000;#ffb000;#4a3410" dur="5s" repeatCount="indefinite" keyTimes="0;0.24;0.3;0.9;1"/>
          </circle>
          <circle cx="93" cy="0" r="4.5" fill="#4a3410">
            <animate attributeName="fill" values="#4a3410;#4a3410;#ffb000;#ffb000;#4a3410" dur="5s" repeatCount="indefinite" keyTimes="0;0.24;0.3;0.9;1"/>
          </circle>
          <text x="93" y="30" font-size="9.5" fill="#8a5a12" text-anchor="middle" letter-spacing="0.6">WEB</text>
        </g>

        <g>
          <circle cx="179" cy="0" r="13" fill="#0c0805" stroke="#4a3410" stroke-width="2">
            <animate attributeName="stroke" values="#4a3410;#4a3410;#ffb000;#ffb000;#4a3410" dur="5s" repeatCount="indefinite" keyTimes="0;0.46;0.52;0.9;1"/>
          </circle>
          <circle cx="179" cy="0" r="4.5" fill="#4a3410">
            <animate attributeName="fill" values="#4a3410;#4a3410;#ffb000;#ffb000;#4a3410" dur="5s" repeatCount="indefinite" keyTimes="0;0.46;0.52;0.9;1"/>
          </circle>
          <text x="179" y="30" font-size="9.5" fill="#8a5a12" text-anchor="middle" letter-spacing="0.6">AD/DC</text>
        </g>

        <g>
          <circle cx="265" cy="0" r="13" fill="#0c0805" stroke="#4a3410" stroke-width="2">
            <animate attributeName="stroke" values="#4a3410;#4a3410;#ffb000;#ffb000;#4a3410" dur="5s" repeatCount="indefinite" keyTimes="0;0.68;0.74;0.9;1"/>
          </circle>
          <circle cx="265" cy="0" r="4.5" fill="#4a3410">
            <animate attributeName="fill" values="#4a3410;#4a3410;#ffb000;#ffb000;#4a3410" dur="5s" repeatCount="indefinite" keyTimes="0;0.68;0.74;0.9;1"/>
          </circle>
          <text x="265" y="30" font-size="9.5" fill="#8a5a12" text-anchor="middle" letter-spacing="0.6">DB</text>
        </g>
      </g>

    </g>
  </g>
</svg>
