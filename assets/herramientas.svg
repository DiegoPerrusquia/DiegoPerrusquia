<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-label="Herramientas: Kali Linux, Burp Suite, Nmap, ffuf, sqlmap, BloodHound, Impacket, Wireshark, Metasploit">
  <defs>
    <linearGradient id="toolCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140b22"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <clipPath id="toolCardClip"><rect x="0" y="0" width="860" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#toolCardClip)">
    <rect x="0" y="0" width="860" height="220" fill="url(#toolCardGrad)"/>
    <rect x="0.5" y="0.5" width="859" height="219" fill="none" stroke="#2a1c46" stroke-width="1.5"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">

      <!-- row 1 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.05s" fill="freeze"/>
        <rect x="28" y="24" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="50" cy="46" r="5" fill="#a855f7"/>
        <text x="68" y="51" font-size="14" fill="#cbb6f0">Kali Linux</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.13s" fill="freeze"/>
        <rect x="300" y="24" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="322" cy="46" r="5" fill="#f43f5e"/>
        <text x="340" y="51" font-size="14" fill="#cbb6f0">Burp Suite</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.21s" fill="freeze"/>
        <rect x="572" y="24" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="594" cy="46" r="5" fill="#f43f5e"/>
        <text x="612" y="51" font-size="14" fill="#cbb6f0">Nmap</text>
      </g>

      <!-- row 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.29s" fill="freeze"/>
        <rect x="28" y="86" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="50" cy="108" r="5" fill="#f43f5e"/>
        <text x="68" y="113" font-size="14" fill="#cbb6f0">ffuf</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.37s" fill="freeze"/>
        <rect x="300" y="86" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="322" cy="108" r="5" fill="#f43f5e"/>
        <text x="340" y="113" font-size="14" fill="#cbb6f0">sqlmap</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.45s" fill="freeze"/>
        <rect x="572" y="86" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="594" cy="108" r="5" fill="#a855f7"/>
        <text x="612" y="113" font-size="14" fill="#cbb6f0">BloodHound</text>
      </g>

      <!-- row 3 -->
