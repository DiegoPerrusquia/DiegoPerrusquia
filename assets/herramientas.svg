        <rect x="300" y="148" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="322" cy="170" r="5" fill="#f43f5e"/>
        <text x="340" y="175" font-size="14" fill="#cbb6f0">Wireshark</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.69s" fill="freeze"/>
        <rect x="572" y="148" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="594" cy="170" r="5" fill="#f43f5e"/>
        <text x="612" y="175" font-size="14" fill="#cbb6f0">Metasploit</text>
      </g>
