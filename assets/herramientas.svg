        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.53s" fill="freeze"/>
        <rect x="28" y="148" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="50" cy="170" r="5" fill="#a855f7"/>
        <text x="68" y="175" font-size="14" fill="#cbb6f0">Impacket</text>
      </g>
      <g opacity="0">
