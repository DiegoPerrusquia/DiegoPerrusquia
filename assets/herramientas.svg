<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Herramientas: Linux, Kali, Burp Suite, Nmap, Active Directory, Wireshark, Docker, PyTorch, Pandas">
  <defs>
    <linearGradient id="toolCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140b22"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <clipPath id="toolCardClip"><rect x="0" y="0" width="860" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#toolCardClip)">
    <rect x="0" y="0" width="860" height="300" fill="url(#toolCardGrad)"/>
    <rect x="0.5" y="0.5" width="859" height="299" fill="none" stroke="#2a1c46" stroke-width="1.5"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">
      <text x="28" y="46" font-size="21" font-weight="600" fill="#c891ff" letter-spacing="1.5">~/ herramientas --activas</text>
      <line x1="28" y1="64" x2="832" y2="64" stroke="#2a1c46" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- row 1 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.05s" fill="freeze"/>
        <rect x="28" y="88" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="50" cy="110" r="5" fill="#a855f7"/>
        <text x="68" y="115" font-size="14" fill="#cbb6f0">Linux</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.13s" fill="freeze"/>
        <rect x="300" y="88" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="322" cy="110" r="5" fill="#f43f5e"/>
        <text x="340" y="115" font-size="14" fill="#cbb6f0">Kali Linux</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.21s" fill="freeze"/>
        <rect x="572" y="88" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="594" cy="110" r="5" fill="#f43f5e"/>
        <text x="612" y="115" font-size="14" fill="#cbb6f0">Burp Suite</text>
      </g>

      <!-- row 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.29s" fill="freeze"/>
        <rect x="28" y="150" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="50" cy="172" r="5" fill="#f43f5e"/>
        <text x="68" y="177" font-size="14" fill="#cbb6f0">Nmap</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.37s" fill="freeze"/>
        <rect x="300" y="150" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="322" cy="172" r="5" fill="#f43f5e"/>
        <text x="340" y="177" font-size="14" fill="#cbb6f0">Active Directory</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.45s" fill="freeze"/>
        <rect x="572" y="150" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="594" cy="172" r="5" fill="#f43f5e"/>
        <text x="612" y="177" font-size="14" fill="#cbb6f0">Wireshark</text>
      </g>

      <!-- row 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.53s" fill="freeze"/>
        <rect x="28" y="212" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="50" cy="234" r="5" fill="#a855f7"/>
        <text x="68" y="239" font-size="14" fill="#cbb6f0">Docker</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.61s" fill="freeze"/>
        <rect x="300" y="212" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="322" cy="234" r="5" fill="#c891ff"/>
        <text x="340" y="239" font-size="14" fill="#cbb6f0">PyTorch</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.69s" fill="freeze"/>
        <rect x="572" y="212" width="256" height="44" rx="8" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
        <circle cx="594" cy="234" r="5" fill="#c891ff"/>
        <text x="612" y="239" font-size="14" fill="#cbb6f0">Pandas</text>
      </g>
    </g>
  </g>
</svg>
