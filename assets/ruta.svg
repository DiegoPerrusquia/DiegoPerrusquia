<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Ruta de ataque animada: foothold, workstation, kerberoast a cuenta de servicio, pass-the-hash a domain admin, dcsync a DC01">
  <defs>
    <linearGradient id="rutaCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140b22"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <clipPath id="rutaCardClip"><rect x="0" y="0" width="860" height="200" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#rutaCardClip)">
    <rect x="0" y="0" width="860" height="200" fill="url(#rutaCardGrad)"/>
    <rect x="0.5" y="0.5" width="859" height="199" fill="none" stroke="#2a1c46" stroke-width="1.5"/>

    <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">

      <!-- static path lines -->
      <line x1="70" y1="95" x2="270" y2="95" stroke="#2a1c46" stroke-width="2"/>
      <line x1="270" y1="95" x2="470" y2="95" stroke="#2a1c46" stroke-width="2"/>
      <line x1="470" y1="95" x2="650" y2="95" stroke="#2a1c46" stroke-width="2"/>
      <line x1="650" y1="95" x2="800" y2="95" stroke="#2a1c46" stroke-width="2"/>

      <!-- edge technique labels -->
      <text x="170" y="61" font-size="11" font-style="italic" text-anchor="middle" fill="#8a6fb0" opacity="0">
        phish
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.08;0.97;1" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="370" y="61" font-size="11" font-style="italic" text-anchor="middle" fill="#8a6fb0" opacity="0">
        kerberoast
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.274;0.34;0.97;1" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="560" y="61" font-size="11" font-style="italic" text-anchor="middle" fill="#8a6fb0" opacity="0">
        pass-the-hash
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.548;0.61;0.97;1" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="725" y="61" font-size="11" font-style="italic" text-anchor="middle" fill="#f43f5e" opacity="0">
        dcsync
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.795;0.86;0.97;1" dur="6s" repeatCount="indefinite"/>
      </text>

      <!-- node 1: foothold -->
      <circle cx="70" cy="95" r="18" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.9">
        <animate attributeName="r" values="32;18;18" keyTimes="0;0.05;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.35;0.35" keyTimes="0;0.05;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="95" r="18" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
      <text x="70" y="100" font-size="12" text-anchor="middle" fill="#c891ff">&gt;_</text>
      <text x="70" y="137" font-size="11" text-anchor="middle" fill="#cbb6f0">foothold</text>

      <!-- node 2: workstation -->
      <circle cx="270" cy="95" r="18" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35">
        <animate attributeName="r" values="18;18;32;18;18" keyTimes="0;0.244;0.274;0.304;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.35;0.9;0.35;0.35" keyTimes="0;0.244;0.274;0.304;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="270" cy="95" r="18" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
      <text x="270" y="100" font-size="12" text-anchor="middle" fill="#c891ff">PC</text>
      <text x="270" y="137" font-size="11" text-anchor="middle" fill="#cbb6f0">WKS01</text>

      <!-- node 3: service account -->
      <circle cx="470" cy="95" r="18" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35">
        <animate attributeName="r" values="18;18;32;18;18" keyTimes="0;0.518;0.548;0.578;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.35;0.9;0.35;0.35" keyTimes="0;0.518;0.548;0.578;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="95" r="18" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
      <text x="470" y="100" font-size="11" text-anchor="middle" fill="#c891ff">SVC</text>
      <text x="470" y="137" font-size="11" text-anchor="middle" fill="#cbb6f0">svc-sql</text>

      <!-- node 4: domain admin -->
      <circle cx="650" cy="95" r="18" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35">
        <animate attributeName="r" values="18;18;32;18;18" keyTimes="0;0.765;0.795;0.825;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.35;0.9;0.35;0.35" keyTimes="0;0.765;0.795;0.825;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="650" cy="95" r="18" fill="#170f27" stroke="#2a1c46" stroke-width="1"/>
      <text x="650" y="100" font-size="11" text-anchor="middle" fill="#c891ff">DA</text>
      <text x="650" y="137" font-size="11" text-anchor="middle" fill="#cbb6f0">domain admin</text>

      <!-- node 5: domain controller (target) -->
      <circle cx="800" cy="95" r="18" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.35">
        <animate attributeName="r" values="18;18;34;18" keyTimes="0;0.94;0.97;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.35;1;0.35" keyTimes="0;0.94;0.97;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="95" r="18" fill="#170f27" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="800" y="100" font-size="11" text-anchor="middle" fill="#f43f5e">DC</text>
      <text x="800" y="137" font-size="11" text-anchor="middle" fill="#cbb6f0">DC01</text>
      <text x="800" y="155" font-size="10" text-anchor="middle" fill="#f43f5e" opacity="0">
        0wned
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.94;0.97;0.995;1" dur="6s" repeatCount="indefinite"/>
      </text>

      <!-- traveling packet -->
      <circle r="9" fill="#f43f5e" opacity="0.3">
        <animateMotion path="M70,95 L270,95 L470,95 L650,95 L800,95" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="#f43f5e">
        <animateMotion path="M70,95 L270,95 L470,95 L650,95 L800,95" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
